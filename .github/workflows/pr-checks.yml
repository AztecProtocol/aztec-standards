name: PR Checks

# SCRATCH, do not merge: live e2e of aztec-benchmark's `block-duration-ms` input
# (AztecProtocol/aztec-benchmark@d623993, branch worktree-aztec-v6-update).
# J1 "6000" should pass; J2 (omitted) should fail at the local DA cap; J3 "6s" should fail in Configure.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  j1-bench-6000:
    uses: AztecProtocol/aztec-benchmark/.github/workflows/pr-benchmark.yml@d623993df314206cf1fd08443d10631976bdcf1d
    with:
      runner: ubuntu-latest
      block-duration-ms: "6000"
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    secrets: inherit

  j2-bench-default:
    uses: AztecProtocol/aztec-benchmark/.github/workflows/pr-benchmark.yml@d623993df314206cf1fd08443d10631976bdcf1d
    with:
      runner: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    secrets: inherit

  j3-bench-invalid:
    uses: AztecProtocol/aztec-benchmark/.github/workflows/pr-benchmark.yml@d623993df314206cf1fd08443d10631976bdcf1d
    with:
      runner: ubuntu-latest
      block-duration-ms: "6s"
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    secrets: inherit
