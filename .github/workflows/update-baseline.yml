name: Update Benchmark Baseline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: update-baseline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  baseline:
    uses: AztecProtocol/aztec-benchmark/.github/workflows/update-baseline.yml@879fa93affa30cb5dade252ea7d2d750366a7962 # v6.0.0-rc.1
    with:
      runner: ubuntu-latest
      block-duration-ms: "6000" # the Vault class publish exceeds the 3s-block DA cap; see js-tests in pr-checks.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit
